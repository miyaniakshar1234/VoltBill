name: Build & Test CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build Binary
      run: cmake --build build --config Release

    - name: Run Native Regression Tests (Unix)
      if: runner.os != 'Windows'
      run: ctest --test-dir build --output-on-failure -C Release

    - name: Run Native Regression Tests (Windows)
      if: runner.os == 'Windows'
      run: ctest --test-dir build --output-on-failure -C Release

    - name: Test CLI Version Output (Unix)
      if: runner.os != 'Windows'
      run: ./build/voltbill --version

    - name: Test CLI Version Output (Windows)
      if: runner.os == 'Windows'
      run: .\build\Release\voltbill.exe --version
